<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0f14">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>JAYASONA PREDIKSI V3.1.1</title>
  <style>
    :root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#eef2f6;background:#0b0f14}
    body{margin:0;background:#0b0f14}
    header{padding:20px 16px;position:sticky;top:0;background:#0b0f14ee;backdrop-filter:blur(8px);border-bottom:1px solid #222b35}
    h1{font-size:22px;margin:0 0 6px}.meta{font-size:13px;color:#9da8b5}
    main{max-width:900px;margin:auto;padding:14px 12px 40px}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    input,select,button{background:#121923;color:#eef2f6;border:1px solid #2a3542;border-radius:9px;padding:10px}
    input{flex:1;min-width:180px}.card{background:#111821;border:1px solid #25303c;border-radius:14px;margin:10px 0;overflow:hidden}
    .league{padding:10px 12px;font-size:12px;font-weight:700;color:#aeb9c5;border-bottom:1px solid #25303c}
    .match{padding:13px}.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
    .team:last-child{text-align:right}.score{text-align:center;font-weight:800}.sub{font-size:12px;color:#8f9aa7;margin-top:8px}
    .empty{padding:30px;text-align:center;color:#9da8b5}.badge{display:inline-block;padding:3px 7px;border-radius:99px;background:#1a2633}
  </style>
</head>
<body>
<header>
  <h1>JAYASONA PREDIKSI V3.1.1</h1>
  <div class="meta" id="meta">Memuat data...</div>
</header>
<main>
  <div class="toolbar">
    <input id="search" placeholder="Cari klub...">
    <select id="status"><option value="">Semua status</option><option>Running</option><option>Completed</option></select>
    <button id="reload">↻ Refresh</button>
  </div>
  <div id="list"></div>
</main>
<script>
let DATA={matches:[]};
const $=id=>document.getElementById(id);
function score(v){return Array.isArray(v)?v.join(" - "):"-";}
function render(){
  const q=$("search").value.toLowerCase().trim(), st=$("status").value;
  const ms=(DATA.matches||[]).filter(m=>
    (!q || `${m.home} ${m.away} ${m.league}`.toLowerCase().includes(q)) &&
    (!st || m.status===st)
  );
  const groups={};
  ms.forEach(m=>(groups[m.league||"Lainnya"]??=[]).push(m));
  $("list").innerHTML="";
  if(!ms.length){$("list").innerHTML='<div class="empty">Tidak ada pertandingan pada filter ini.</div>';return;}
  for(const [league,arr] of Object.entries(groups)){
    const c=document.createElement("section"); c.className="card";
    c.innerHTML=`<div class="league">${league} <span class="badge">${arr.length}</span></div>`;
    arr.forEach(m=>{
      const x=document.createElement("div"); x.className="match";
      x.innerHTML=`<div class="teams"><div class="team">${m.home}</div><div class="score">${score(m.ft)}</div><div class="team">${m.away}</div></div>
      <div class="sub">${m.kickoff} · HT ${score(m.ht)} · <b>${m.status||"Running"}</b></div>`;
      c.appendChild(x);
    });
    $("list").appendChild(c);
  }
}
async function load(){
  $("meta").textContent="Memuat data...";
  try{
    const r=await fetch("data.json?ts="+Date.now(),{cache:"no-store"});
    DATA=await r.json();
    $("meta").textContent=`${DATA.count ?? DATA.matches?.length ?? 0} pertandingan · update ${DATA.updated_at ?? "-"}`;
    render();
  }catch(e){$("meta").textContent="Gagal memuat data.json";$("list").innerHTML='<div class="empty">Data belum tersedia.</div>';}
}
$("search").addEventListener("input",render); $("status").addEventListener("change",render); $("reload").onclick=load;
load();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
