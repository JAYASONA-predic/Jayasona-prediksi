ata.map(x=>x.date).filter(Boolean))].sort();league.innerHTML='<option value="">Semua liga</option>'+ls.map(x=>'<option>'+e(x)+'</option>').join('');date.innerHTML='<option value="">Semua tanggal</option>'+ds.map(x=>'<option>'+e(x)+'</option>').join('')}function render(){let q=n(search.value),lg=league.value,dt=date.value,a=data.filter(m=>{let s=st(m),ok=tab==='all'||tab===s||(tab==='fav'&&fav.has(m.id));return ok&&(!q||n(m.home+' '+m.away+' '+m.league).includes(q))&&(!lg||m.league===lg)&&(!dt||m.date===dt)});count.textContent=a.length+' pertandingan';list.innerHTML=a.length?a.map(m=>{let s=st(m),sc=m.final_home!==''?m.final_home+' - '+m.final_away:'— - —',ht=m.ht_home!==''?m.ht_home+' - '+m.ht_away:'—';return '<div class="card"><div class="top"><div class="league">'+e(m.league)+'</div>'+e(m.kickoff)+'<span class="status">'+(s==='live'?'🔴 LIVE':s==='done'?'SELESAI':'MENDATANG')+'</span></div><div class="teams"><div class="team"><div class="crest">'+ini(m.home)+'</div>'+e(m.home)+'</div><div class="score">'+sc+'<div style="font-size:9px;color:#718078">HT '+e(ht)+'</div></div><div class="team"><div class="crest">'+ini(m.away)+'</div>'+e(m.away)+'</div></div><div class="meta"><div class="box"><small>STATUS</small>'+e(m.status||'-')+'</div><div class="box"><small>TANGGAL</small>'+e(m.date||'-')+'</div><div class="box"><small>SUMBER</small>MBox888</div></div><div class="actions"><button onclick="fav.has(m.id)?fav.delete(m.id):fav.add(m.id);localStorage.setItem('jayasona_fav_v31',JSON.stringify([...fav]));render()">'+(fav.has(m.id)?'★ Favorit':'☆ Favorit')+'</button></div></div>'}).join(''):'<div class="empty">Tidak ada pertandingan yang cocok.</div>'}fetch('data.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(j=>{data=Array.isArray(j.matches)?j.matches:[];updated.textContent=j.updated_at||'belum tersedia';total.textContent=j.count??data.length;filters();render()}).catch(()=>{updated.textContent='gagal memuat data';list.innerHTML='<div class="empty">data.json
