<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07100c">
<link rel="manifest" href="manifest.json">
<title>JAYASONA PREDIKSI V3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050b08;color:#f5f7f5;font-family:Arial,sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;background:#07100c}
header{padding:16px 18px;background:#08110d;position:sticky;top:0;z-index:5;border-bottom:1px solid #203127}.brand{font-size:21px;font-weight:800}.brand b{color:#b7f34a}.tools{float:right;margin-top:-30px}.tool{background:#101c16;color:#d6e0d9;border:1px solid #293b31;border-radius:11px;padding:9px 12px;margin-left:5px}
.hero{margin:10px 16px 14px;padding:20px;border:1px solid #2b4234;border-radius:22px;background:linear-gradient(135deg,#101c16,#294528)}.hero small{color:#b7f34a}.hero h1{margin:7px 0 4px;font-size:25px}.hero p{margin:0;color:#91a097;font-size:12px}.sync{margin-top:10px;font-size:10px;color:#aebbb3}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#b7f34a;margin-right:5px}
.search{margin:0 16px 8px;width:calc(100% - 32px);padding:14px;border-radius:14px;border:1px solid #293b31;background:#0c1712;color:#fff;outline:none}.search:focus{border-color:#b7f34a}
.filters{display:flex;gap:7px;padding:0 16px 10px;overflow:auto}.filters select{background:#0c1712;color:#cdd7d1;border:1px solid #293b31;border-radius:12px;padding:9px;max-width:170px}.tabs{display:flex;gap:8px;padding:0 16px 12px;overflow:auto}.tabs button{white-space:nowrap;border:1px solid #293b31;background:#0c1712;color:#9ba89f;padding:10px 14px;border-radius:20px}.tabs .active{background:#b7f34a;color:#071006;border-color:#b7f34a;font-weight:700}
.section{padding:9px 18px;color:#b6c0ba;font-size:13px;font-weight:700}.count{float:right;color:#718078;font-weight:400}
.card{margin:9px 16px;padding:0 13px 13px;border:1px solid #25382d;border-radius:19px;background:#0a1510}.top{padding:11px 2px;border-bottom:1px solid #203127;color:#849188;font-size:10px}.league{color:#b7f34a;margin-bottom:4px}.live{float:right;color:#ff5570;font-weight:bold}.status{float:right;color:#b7f34a;font-weight:bold}.teams{display:grid;grid-template-columns:1fr 62px 1fr;align-items:center;padding:15px 0 12px}.team{text-align:center;font-weight:700;font-size:13px}.crest{width:48px;height:48px;border-radius:50%;border:1px solid #385143;background:#06100b;display:grid;place-items:center;margin:auto auto 6px;color:#b7f34a;font-weight:800;overflow:hidden}.crest img{width:42px;height:42px;object-fit:contain}.score{text-align:center;font-size:24px;font-weight:800}.mins{font-size:9px;color:#718078;margin-top:4px}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.box{background:#111f18;border:1px solid #1f3127;border-radius:10px;padding:9px 3px;text-align:center}.box small{display:block;color:#718078;font-size:8px;margin-bottom:4px}.box strong{font-size:12px}.actions{display:flex;gap:7px;margin-top:9px}.actions button{flex:1;background:#0d1813;color:#b8c2bb;border:1px solid #2a3d31;border-radius:10px;padding:9px;font-size:11px}
.empty{margin:18px 16px;padding:25px 15px;text-align:center;border:1px dashed #294034;border-radius:15px;color:#849188}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#07100cf5;border-top:1px solid #24362c;padding:8px;z-index:10}.nav button{background:none;border:0;color:#7a887f;font-size:10px}.nav .sel{color:#b7f34a}.spacer{height:72px}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:20;align-items:flex-end}.modal.show{display:flex}.sheet{width:min(520px,100%);margin:auto 0 0;background:#0a1510;border:1px solid #294034;border-radius:22px 22px 0 0;padding:18px}.sheet h2{margin:0 0 5px;font-size:20px}.sheet p{color:#91a097;margin:5px 0 15px}.detailgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.detailgrid div{background:#111f18;border:1px solid #203127;border-radius:10px;padding:10px}.detailgrid small{display:block;color:#718078;font-size:8px}.detailgrid b{display:block;margin-top:4px}.close{width:100%;margin-top:12px;padding:11px;border-radius:10px;border:1px solid #2a3d31;background:#0d1813;color:#dce4df}
</style>
</head>
<body>
<div class="app">
<header><div class="brand">JAYASONA <b>PREDIKSI</b></div><div class="tools"><button class="tool" onclick="focusSearch()">⌕</button><button class="tool" onclick="location.reload()">↻</button></div></header>
<div class="hero"><small>MBOX888 RESULT SYNC</small><h1>Match Center V3</h1><p>Data pertandingan diperbarui dari sumber MBox888 melalui GitHub Actions.</p><div class="sync"><span class="dot"></span>Database: <b id="updated">memuat...</b></div></div>
<input id="search" class="search" placeholder="Cari klub atau liga..." autocomplete="off" oninput="render()">
<div class="filters"><select id="league" onchange="render()"><option value="">Semua liga</option></select><select id="date" onchange="render()"><option value="">Semua tanggal</option></select></div>
<div class="tabs"><button class="active" onclick="setTab('all',this)">Semua</button><button onclick="setTab('live',this)">🔴 Live</button><button onclick="setTab('next',this)">Mendatang</button><button onclick="setTab('done',this)">Selesai</button><button onclick="setTab('fav',this)">⭐ Favorit</button></div>
<div class="section">⚽ HASIL MBOX888 <span id="count" class="count"></span></div>
<div id="list"></div><div class="spacer"></div>
<nav class="nav"><button class="sel" onclick="setTab('all')">⌂<br>Home</button><button onclick="setTab('live')">◉<br>Live</button><button onclick="setTab('fav')">☆<br>Favorit</button><button onclick="location.reload()">↻<br>Update</button></nav>
</div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><h2 id="modalTitle"></h2><p id="modalSub"></p><div id="modalGrid" class="detailgrid"></div><button class="close" onclick="closeModal()">Tutup</button></div></div>
<script>
const FALLBACK_LOGO={};
let data=[],tab='all',fav=new Set(JSON.parse(localStorage.getItem('jayasona_fav_v3')||'[]'));
const norm=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ini(x){return String(x).split(/\s+/).map(v=>v[0]||'').join('').slice(0,3).toUpperCase()}
function setTab(x,el){tab=x;document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));if(el)el.classList.add('active');render()}
function focusSearch(){document.getElementById('search').focus()}
function toggleFav(id){fav.has(id)?fav.delete(id):fav.add(id);localStorage.setItem('jayasona_fav_v3',JSON.stringify([...fav]));render()}
function statusOf(m){if(m.status==='Running'||m.status==='Live')return'live';if(m.final_home!=null&&m.final_home!==''&&m.final_away!=null&&m.final_away!=='')return'done';return'next'}
function loadFilters(){
 const ls=[...new Set(data.map(x=>x.league).filter(Boolean))].sort();
 const ds=[...new Set(data.map(x=>x.date).filter(Boolean))].sort();
 document.getElementById('league').innerHTML='<option value="">Semua liga</option>'+ls.map(x=>`<option>${esc(x)}</option>`).join('');
 document.getElementById('date').innerHTML='<option value="">Semua tanggal</option>'+ds.map(x=>`<option>${esc(x)}</option>`).join('');
}
function render(){
 const q=norm(document.getElementById('search').value.trim()),lg=document.getElementById('league').value,dt=document.getElementById('date').value;
 const arr=data.filter(m=>{let st=statusOf(m);let ok=tab==='all'||(tab==='live'&&st==='live')||(tab==='next'&&st==='next')||(tab==='done'&&st==='done')||(tab==='fav'&&fav.has(m.id));return ok&&(!q||norm(m.home+' '+m.away+' '+m.league).includes(q))&&(!lg||m.league===lg)&&(!dt||m.date===dt)});
 document.getElementById('count').textContent=arr.length+' pertandingan';
 document.getElementById('list').innerHTML=arr.length?arr.map(card).join(''):`<div class="empty">Tidak ada pertandingan yang cocok.</div>`;
}
function card(m){
 const st=statusOf(m), score=(m.final_home!==''&&m.final_home!=null&&m.final_away!==''&&m.final_away!=null)?`${m.final_home} - ${m.final_away}`:'— - —';
 const ht=(m.ht_home!==''&&m.ht_home!=null&&m.ht_away!==''&&m.ht_away!=null)?`${m.ht_home} - ${m.ht_away}`:'—';
 return `<div class="card"><div class="top"><div class="league">${esc(m.league||'MBox888')}</div>${esc(m.kickoff||'')}<span class="${st==='live'?'live':'status'}">${st==='live'?'● LIVE':st==='done'?'SELESAI':'MENDATANG'}</span></div>
 <div class="teams"><div class="team"><div class="crest">${ini(m.home)}</div>${esc(m.home)}</div><div class="score">${score}<div class="mins">${esc(m.source_format||'MATCH')}</div></div><div class="team"><div class="crest">${ini(m.away)}</div>${esc(m.away)}</div></div>
 <div class="meta"><div class="box"><small>HT</small><strong>${esc(ht)}</strong></div><div class="box"><small>STATUS</small><strong>${esc(m.status||'-')}</strong></div><div class="box"><small>TANGGAL</small><strong>${esc(m.date||'-')}</strong></div></div>
 <div class="actions"><button onclick="toggleFav('${esc(m.id)}')">${fav.has(m.id)?'★ Favorit':'☆ Favorit'}</button><button onclick="openDetail('${esc(m.id)}')">Detail pertandingan</button></div></div>`;
}
function openDetail(id){
 const m=data.find(x=>x.id===id);if(!m)return;
 document.getElementById('modalTitle').textContent=m.home+' vs '+m.away;
 document.getElementById('modalSub').textContent=(m.league||'MBox888')+' · '+(m.kickoff||'');
 document.getElementById('modalGrid').innerHTML=`<div><small>SKOR AKHIR</small><b>${m.final_home??'-'} - ${m.final_away??'-'}</b></div><div><small>PARUH PERTAMA</small><b>${m.ht_home??'-'} - ${m.ht_away??'-'}</b></div><div><small>STATUS</small><b>${esc(m.status||'-')}</b></div><div><small>TANGGAL</small><b>${esc(m.date||'-')}</b></div><div><small>WAKTU</small><b>${esc(m.kickoff||'-')}</b></div><div><small>SUMBER</small><b>MBox888</b></div>`;
 document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show')}
fetch('data.json?'+Date.now()).then(r=>r.json()).then(j=>{data=Array.isArray(j.matches)?j.matches:[];document.getElementById('updated').textContent=j.updated_at||'belum tersedia';loadFilters();render()}).catch(()=>{document.getElementById('updated').textContent='gagal memuat data';document.getElementById('list').innerHTML='<div class="empty">data.json belum tersedia atau gagal dimuat.</div>'});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
