<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07120d">
  <meta name="description" content="JAYASONA PREDIKSI — Virtual PES 21 Match Center">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>JAYASONA PREDIKSI</title>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">JAYASONA <span>PREDIKSI</span></div>
      <div class="top-actions">
        <button class="icon-btn" id="searchToggle" aria-label="Cari">⌕</button>
        <button class="icon-btn" id="menuToggle" aria-label="Menu">☰</button>
      </div>
    </header>

    <main class="content">
      <section class="hero">
        <div class="eyebrow">SABA CLUB FRIENDLY</div>
        <h1>Virtual PES 21</h1>
        <p>15 Minutes Play · Match Center · Database V2</p>
      </section>

      <div class="search-wrap" id="searchWrap">
        <input id="search" type="search" placeholder="Cari klub, contoh: Liverpool..." autocomplete="off">
      </div>

      <div class="quick-clubs" id="quickClubs"></div>

      <nav class="filters" aria-label="Filter pertandingan">
        <button class="filter active" data-filter="all">Semua</button>
        <button class="filter" data-filter="live"><span class="red-dot"></span> Live</button>
        <button class="filter" data-filter="upcoming">Mendatang</button>
        <button class="filter" data-filter="favorite">⭐ Favorit</button>
      </nav>

      <section id="matchList"></section>
      <div id="empty" class="empty hidden">Tidak ada pertandingan yang cocok.</div>
    </main>

    <div class="toast" id="toast"></div>

    <nav class="bottom-nav">
      <button class="bottom-item active" data-bottom="home"><span>⌂</span><small>Home</small></button>
      <button class="bottom-item" data-bottom="live"><span>●</span><small>Live</small></button>
      <button class="bottom-item" data-bottom="favorite"><span>☆</span><small>Favorit</small></button>
      <button class="bottom-item" data-bottom="menu"><span>☰</span><small>Menu</small></button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
